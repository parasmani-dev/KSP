openapi: 3.0.0
info:
  title: Graph API
  version: 1.0.0
paths:
  /graph/network:
    get:
      summary: Get graph network
      responses:
        '200':
          description: OK
  /graph/centrality:
    get:
      summary: Get graph centrality
      responses:
        '200':
          description: OK
  /graph/communities:
    get:
      summary: Get graph communities
      responses:
        '200':
          description: OK
  /graph/search:
    get:
      summary: Search node by name
      responses:
        '200':
          description: OK
  /graph/hotspots:
    get:
      summary: Get crime hotspots
      responses:
        '200':
          description: OK
  /predict/links:
    get:
      summary: Predict hidden connections
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  predictions:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                        target:
                          type: string
                        confidence_score:
                          type: number
                        method:
                          type: string
                        explanation:
                          type: object
                          properties:
                            shared_connections:
                              type: array
                              items:
                                type: string
                            reason:
                              type: string
  /predict/accomplices/{citizen_id}:
    get:
      summary: Predict hidden accomplices for a given citizen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  predictions:
                    type: array
                    items:
                      type: object
                      properties:
                        accomplice:
                          type: string
                        confidence_score:
                          type: number
                        method:
                          type: string
                        explanation:
                          type: object
                          properties:
                            shared_connections:
                              type: array
                              items:
                                type: string
                            reason:
                              type: string
  /predict/clusters:
    get:
      summary: Crime cluster groupings
      responses:
        '200':
          description: OK
