openapi: 3.0.0
info:
  title: Graph API
  version: 1.0.0
paths:
  /graph/network:
    get:
      summary: Get graph network
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  network:
                    type: object
                    properties:
                      nodes:
                        type: array
                        items:
                          type: object
                          description: >
                            Warning: Source entities.csv uses 'threat_level', but the 
                            frontend dashboard expects 'risk_score'. The backend API currently 
                            translates this at runtime, but this is a band-aid. Fix CSV schema.
                      links:
                        type: array
                        items:
                          type: object
  /graph/centrality:
    get:
      summary: Get graph centrality
      responses:
        '200':
          description: OK
  /graph/communities:
    get:
      summary: Get graph communities
      responses:
        '200':
          description: OK
  /graph/search:
    get:
      summary: Search node by name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  network:
                    type: object
                    properties:
                      nodes:
                        type: array
                        items:
                          type: object
                      links:
                        type: array
                        items:
                          type: object
  /graph/hotspots:
    get:
      summary: Get crime hotspots
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  hotspots:
                    type: array
                    items:
                      type: object
                      properties:
                        area:
                          type: string
                        crime_count:
                          type: integer
  /predict/links:
    get:
      summary: Predict hidden connections
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  predictions:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                        target:
                          type: string
                        confidence_score:
                          type: number
                        method:
                          type: string
                        explanation:
                          type: object
                          properties:
                            shared_connections:
                              type: array
                              items:
                                type: string
                            reason:
                              type: string
  /predict/accomplices/{citizen_id}:
    get:
      summary: Predict hidden accomplices for a given citizen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  predictions:
                    type: array
                    items:
                      type: object
                      properties:
                        accomplice:
                          type: string
                        confidence_score:
                          type: number
                        method:
                          type: string
                        explanation:
                          type: object
                          properties:
                            shared_connections:
                              type: array
                              items:
                                type: string
                            reason:
                              type: string
  /predict/clusters:
    get:
      summary: Crime cluster groupings
      responses:
        '200':
          description: OK
  /graph/explain/{node_id}:
    get:
      summary: Explain node
      parameters:
        - in: path
          name: node_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  explanation:
                    type: string
  /events/sse:
    get:
      summary: Real-time event stream
      description: |
        Python ai-services owns all SSE/WebSocket connections to frontend. 
        Spring Boot does not proxy or duplicate real-time events.
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
components:
  schemas:
    Reason:
      description: |
        XAI module owns formatting. Modules must NOT return pre-formatted human-readable strings.
      type: object
      properties:
        reason_codes:
          type: array
          items:
            type: string
        weights:
          type: object
          additionalProperties:
            type: number
            format: float
        entity_refs:
          type: array
          items:
            type: string

