services:
  frontend:
    build:
      context: ./frontend
    environment:
      AI_SERVICE_URL: http://ai-services:8000
      GRAPH_SERVICE_URL: http://graph-service:8001
      EVIDENCE_SERVICE_URL: http://evidence-engine:8002
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      ai-services:
        condition: service_healthy
      graph-service:
        condition: service_healthy
      evidence-engine:
        condition: service_healthy
    restart: unless-stopped

  ai-services:
    build:
      context: .
      dockerfile: ai-services/Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  graph-service:
    build:
      context: .
      dockerfile: graph-service/Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  evidence-engine:
    build:
      context: ./ai-services/evidence-engine
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
